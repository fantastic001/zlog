[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zlog"
version = "0.1.0"
description = "Extract metrics from iteration logs and compare experiment groups statistically"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ email = "snstefan5@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.1",
]

[project.scripts]
zlog-analyze = "zlog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=zlog",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["zlog"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "PLC0415"]
"src/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
